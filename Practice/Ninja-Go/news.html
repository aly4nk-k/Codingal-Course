<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="pages.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=New+Rocker&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Carter+One&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header>
      <a href="Home.html" class="title-link">
        <h1 class="rocker">
          <span class="text-light">Ninja</span>
          <span class="text-warning">Verse</span>
        </h1>
      </a>
      <nav>
        <ul>
          <li><a href="Home.html" class="text-light">Home</a></li>
          <li class="text-warning">|</li>
          <li><a href="#info" class="text-light">About</a></li>
          <li class="text-warning">|</li>
          <li><a href="Team.html" class="text-light"> The Team</a></li>
          <li class="text-warning">|</li>
          <li><a href="Villains.html" class="text-light">Villains</a></li>
          <li class="text-warning">|</li>
          <li><a href="" class="text-light">News</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section>
        <div class="flex">
          <div>
            <h2 class="rocker text-center">
              <span class="text-light">Recent </span>
              <span class="text-warning">News</span>
            </h2>
            <div
              id="newsCarousel"
              class="carousel slide"
              data-ride="carousel"
              data-interval="2000"
            >
              <!-- Indicators -->
              <ol class="carousel-indicators">
                <li
                  data-target="#newsCarousel"
                  data-slide-to="0"
                  class="active"
                ></li>
                <li data-target="#newsCarousel" data-slide-to="1"></li>
                <li data-target="#newsCarousel" data-slide-to="2"></li>
              </ol>

              <!-- Slides -->
              <div class="carousel-inner">
                <div class="carousel-item active">
                  <img src="arashia.jpg" class="d-block w-100" alt="News 1" />
                  <div class="carousel-caption">
                    <h4>Dragons Rising Season 4</h4>
                    <p>New Ship ?</p>
                  </div>
                </div>

                <div class="carousel-item">
                  <img src="snow ras.png" class="d-block w-100" alt="News 2" />
                  <div class="carousel-caption">
                    <h4>New Villain</h4>
                    <p>Meet the newest threat to Ninjago.</p>
                  </div>
                </div>

                <div class="carousel-item">
                  <img src="intro.png" class="d-block w-100" alt="News 3" />
                  <div class="carousel-caption">
                    <h4>Upcoming Episodes</h4>
                    <p>What fans can expect next.</p>
                  </div>
                </div>
              </div>
               <!-- Controls -->
            <a
              class="carousel-control-prev"
              href="#newsCarousel"
              data-slide="prev"
            >
              <span class="carousel-control-prev-icon"></span>
            </a>

            <a
              class="carousel-control-next"
              href="#newsCarousel"
              data-slide="next"
            >
              <span class="carousel-control-next-icon"></span>
            </a>
            </div>
           
          </div>
          <div>
            <h2 class="text-center rocker">
              <span class="text-light">Share Your</span>
              <span class="text-warning">Opinions</span>
            </h2>
            <div class="opinion-box"></div>
          </div>
        </div>
      </section>
      <hr />
    </main>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.min.js"></script>
  </body>
</html>
