<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Countdown</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">
    <style>
:root{
    --primary:purple;
    --secondary:rgb(255, 237, 255);
    --font: "Archivo Black", sans-serif;
}

header{
    width:100%;
    height:80px;
    padding:10px 15px;
    border-bottom:2px solid var(--primary);
    color:var(--primary);
    box-shadow:0px 5px 30px var(--primary);
    position:fixed;
    top:0;
    left:0;
    font-family:var(--font);
    font-size:20px;
    z-index: 1;
    background-color: var(--secondary);
}

main{
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding:125px 0px;
    background-color: rgb(255, 250, 255);
}

h2,h3{
    color:var(--primary);
    font-family: var(--font);
    margin:30px 0px;
}

.box{
    border:2px solid var(--primary);
    background-color: var(--secondary);
    border-radius: 20px;
    padding-top:10px;
    color:var(--primary);
    font-weight: bold;
    height:50px;
    box-shadow:0px 0px 20px var(--primary);
    width:500px;
    margin:0 auto;
}

.btn{
    border:2px solid var(--primary);
    background-color: var(--secondary);
    padding:10px 10px;
    font-weight: bold;
    color:var(--primary);
    border-radius: 15px;
    transition: 0.3s ease;
    box-shadow:0px 5px 20px var(--primary);
    margin:20px 0px;
}

.btn:hover{
    color:white;
    background-color: var(--primary);
}

.btn:focus{
    background-color: var(--primary);
    color:white;
    border:2px solid var(--primary);
    box-shadow:0px 5px 50px var(--primary);
}

.details{
    border:2px solid var(--primary);
    box-shadow:0px 0px 30px var(--primary);
    width:700px;
    height:500px;
    background-color: var(--secondary);
    border-radius: 15px;
    text-align: left;
    padding:30px 40px;
    overflow-x:auto;
}

.detail-box{
    border:2px solid var(--primary);
    width:100%;
    background-color: var(--secondary);
    border-radius:20px;
    padding:10px 15px;
    font-weight: bold;
    color:var(--primary);
    box-shadow:0px 0px 20px var(--primary);
    margin:15px 0px;
    height:50px;
}

h5{
    color:var(--primary);
    font-family: var(--font);
}

.hide{
    opacity:0;
    transition: 0.3s ease;
}

.flex{
    display:flex;
    gap:50px;
    flex-direction: row;
}

.details h3{
    text-align:center;
}

.details .btn{
    display:block;
    margin:40px auto;
}

.msg-box{
    border:2px solid var(--primary);
    width:100%;
    background-color: var(--secondary);
    border-radius:20px;
    padding:10px 15px;
    font-weight: bold;
    color:var(--primary);
    box-shadow:0px 0px 20px var(--primary);
    margin:15px 0px;
    height:50px;
    transition:0.3s ease;
    opacity:0;
}

footer{
    border-top:2px solid var(--primary);
    box-shadow:0px -5px 30px var(--primary);
    padding:15px 15px;
    color:var(--primary);
    font-family:var(--font);
    font-size:25px;
}
    </style>
</head>
<body>
    <header>
<h1>Bday-Countdown</h1>
    </header>

    <main>
        <section class="text-center">
<h2>Calculate Day's to The Given Birthday</h2>

<h3>Birthday</h3>
<div class="box"><p>30 - 8 - 2012</p></div>

<h3>Day's to Birthday</h3>
<div><p id="bday" class="box"></p></div>

<button class="btn" onclick="showBday()">Calculate</button>

<div class="hide">
    
<h3>Birthday Details</h3>
<div class="flex">
<div class="details">

<h5>Name :</h5>
<p class="detail-box">Alyan Kabir</p>

<h5>Current Age :</h5>
<p class="detail-box">13</p>

<h5>Age After Birthday :</h5>
<p class="detail-box">14</p>

<h5>Message :</h5>
<p class="detail-box" id="msg"></p>
</div>
<div class="details">
<h3>Excitement Generator</h3>
<button id="btn1" class="btn" onclick="showMsg()">Generate</button>
<button id="btn2" class="btn" onclick="repeatMsg()" style="display:none;">Repeat x5</button>
<div>
    <p id="load" class="msg-box"></p>
    <div class="msg">

    </div>
</div>
</div>
</div>
</div>
        </section>
    </main>

      <footer>
            <p>&copy; 2026 bday-Countdown. All rights reserved.</p>
        </footer>

    <script>
        
            let date = new Date();
            let day = date.getDate();
            let month = date.getMonth();
            let birthday = 30;

        function showBday() {
            document.querySelector(".hide").style.opacity = "1";


            let daysLeft = birthday - day;
            document.getElementById("bday").innerHTML = daysLeft;

            if (day > birthday) {
                document.getElementById("msg").innerHTML = "Aw! Your Birthday Has Passed";
            } else if (month > 7) {
                document.getElementById("msg").innerHTML = "Aw! Your Birthday Has Passed";
            } else{
                document.getElementById("msg").innerHTML = "Coming Soon!";
            }
        
        }

          function showMsg() {
            let count = 0;
            while (count < 2) {

                if (day > birthday) {
                document.getElementById("load").innerHTML = "Hope You Had a Good Birthday!! 💖 ";
            } else if (month > 7) {
                document.getElementById("load").innerHTML = "Hope You Had a Good Birthday!! 💖 ";
            } else{
                document.getElementById("load").innerHTML = "Have a Great Birthday!! 🎉 ";
            }

            count++;

            }
            document.querySelector(".msg-box").style.opacity = "1";
            document.querySelector("#btn1").style.display = "none";
            document.querySelector("#btn2").style.display = "block";
            }

            function repeatMsg() {
                  let count = 0;
            while (count < 5) {

                if (day > birthday) {
                document.querySelector(".msg").innerHTML += `<div class="msg-box" style="opacity:1;">Hope You Had a Good Birthday!! 💖</div> `;
            } else if (month > 7) {
                document.querySelector(".msg").innerHTML += `<div class="msg-box" style="opacity:1;">Can't Wait for Next Year!!</div> `;
            } else if (day == birthday) {
                document.querySelector(".msg").innerHTML += `<div class="msg-box" style="opacity:1;">Happy Birthday !! 🎉💖</div> `;
            } else{
                document.querySelector(".msg").innerHTML += `<div class="msg-box" style="opacity:1;">May your wishes come true!! ✨</div> `;
            } 

             
            count++;

            }
            }
    </script>
</body>
</html>
