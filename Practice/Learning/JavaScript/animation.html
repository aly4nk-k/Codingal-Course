<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Practice</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">

    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            gap: 30px;
            overflow: hidden;
        }

        button {
            padding: 15px 30px;
            font-size: 20px;
        }

        .box {
            width: 250px;
            height: 200px;
            background-color: purple;
            position:absolute;
            right: -200px;
            animation: appear 1.2s ease forwards;
        }

        .badge{
            position:absolute;
            top:20px;
            right:20px;
            color:white;
            font-size: 30px;
            user-select: none;
            cursor: pointer;
        }
        @keyframes appear {
            from {
                opacity: 0;
                transform: translateX(0px);
            }

            to {
                opacity: 1;
                transform: translateX(-225px);
            }
        }

        .spinner-border{
            display:none;
        }

    </style>
</head>

<body>
    <button onclick="showBox()">Show Box</button>
<div class="spinner-border"></div>
<p></p>
    <div id="box" class="sui"><div class="badge" onclick="removeBox()">&times;</div>

    <script>
        function showBox() {
            setTimeout(function() {
document.querySelector(".spinner-border").style.display = "block";
document.querySelector("p").textContent = "Loading...";
            },1000);

            setTimeout(function() {
                document.querySelector(".spinner-border").style.display = "none";
                document.querySelector("p").textContent = "";
            } ,4000)
            
            setTimeout(function() {
             document.getElementById("box").style.display = "none";   
              document.getElementById("box").classList.add("box");
 document.getElementById("box").style.display = "block";
        }, 6000);
           
        }

        function removeBox() {
            document.getElementById("box").style.display = "none";
 
        }
    </script>

</body>
</html>
