<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Vibes</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body{
            background-image: url('sunset.jpg');
            width:100%;
            height:100vh;
            overflow: hidden;
            background-repeat: no-repeat;
            padding:0;
            margin:0;
            background-position: center;
            background-size:cover;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .vibe-box{
            background-color: #061e51;
            max-width:700px;
            width:700px;
            min-height:500px;
            border-radius:20px;
            text-align: center;
        }

        h1,h2{
             font-family: 'DynaPuff', cursive;
             color:white;
        }
    </style>
</head>
<body>
    <div class="vibe-box">
<h1>Daily Vibe 😎</h1>
<h2>How are you feeling today ??</h2>
    </div>
</body>
</html>
