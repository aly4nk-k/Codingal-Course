<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ninja-Verse | Characters</title>
     <link rel="stylesheet" href="ninjaverse.css">
    <link href="https://fonts.googleapis.com/css2?family=New+Rocker&display=swap" rel="stylesheet">
</head>
<body>
     <header>
<h1>
    <span class="light">Ninja</span>
    <span class="primary">Verse</span>
</h1>
<div>
    <button onclick="revealMenu()">☰</button>
</div>
    </header>

    <main>
        <article class="menu menu-hide">
           <button class="remove" onclick="hideMenu()">&times;</button>
<div class="menu-box"><button class="menu-item"><a href="ninjaverse.html">Home</a></button></div>
<div class="menu-box"><button class="menu-item"><a href="character.html">Characters</a></button></div>
<div class="menu-box"><button class="menu-item"><a href="weapon-element.html">Elements | Weapons</a></button></div>
<div class="menu-box"><button class="menu-item"><a href="about.html">About Us</a></button></div>
<div class="menu-box"><button class="menu-item"><a href="seasons.html">Seasons</a></button></div>
<div class="menu-box"><button class="menu-item"><a href="">News</a></button></div>
<div class="menu-box"><button class="menu-item"><a href="">Community</a></button></div>
        </article>

        <section class="overlay">
            <div class="alert">
<h2>hello</h2>
            </div>
        </section>

        <section class="characters-content">
            <h2>
                <span class="light">Meet The Characters of</span>
                <span class="primary">Ninjago</span>
            </h2>
            <div class="searchbar">
<input type="text" class="search" placeholder="Enter Character Name...">
<button class="search-button" onclick="search()">Search</button>
</div>
<div class="select-box">
    <div class="flex-select">
<button onclick="showAll()">All</button>
<h3>|</h3>
<button onclick="showVillains()">Villains</button>
<h3>|</h3>
<button onclick="showNinja()">Ninja Team</button>
<h3>|</h3>
<button onclick="showElemental()">Elemental Masters</button>
</div>
</div>
<div class="flex-box">


</div>
        </section>

      


            <script>

    function revealMenu() {
        document.querySelector(".menu-hide").style.display = "flex";
        document.querySelector(".menu-hide").style.position = "fixed"
        document.body.style.overflow = "hidden";
    }

    function hideMenu() {
         document.querySelector(".menu-hide").style.display = "none"
          document.body.style.overflow = "auto";
    }

    function search() {

    let name = document.querySelector(".search").value.toLowerCase().trim();

    function makeCard() {
   return `
   <div class="team-box">
    <img src="Images/${name}${imgtype}" class="box-img" alt="${name}">
    <h4>${name}</h4>
    </div>
   `;
}

let imgtype = ".jpg";

if (
    name === "morro" ||
    name === "lloyd" ||
    name === "kai" ||
    name === "cole" ||
    name === "jay" ||
    name === "nya" ||
    name === "zane"
) {
    imgtype = ".png";
}
else if (
    name === "ironbaron" ||
    name === "glutinos"
) {
    imgtype = ".webp";
}

document.querySelector(".flex-box").innerHTML = makeCard();
console.log(name);
console.log(`<img src="Images/${name}${imgtype}" class="box-img"`);
}

    function showVillains() {
         let hidden2 = document.querySelectorAll(".team-box");

    for(i = 0; i < hidden2.length; i++) {
        hidden2[i].style.display = "none";
    }

        let hidden = document.querySelectorAll(".ninja");

    for(i = 0; i < hidden.length; i++) {
        hidden[i].style.display = "none";
    }
     let hiddenelement = document.querySelectorAll(".elemental");

    for(i = 0; i < hiddenelement.length; i++) {
        hiddenelement[i].style.display = "none";
    }
        let villains = document.querySelectorAll(".villain");

        for (let i = 0; i < villains.length; i++) {
            villains[i].style.display = "flex";
        }
    }

    function removeAlert() {
        document.querySelector(".alert").style.display = "none";
   document.querySelector(".overlay").style.display = "none";
    }

    function showNinja() {
         let hidden1 = document.querySelectorAll(".team-box");

    for(i = 0; i < hidden1.length; i++) {
        hidden1[i].style.display = "none";
    }

    let hidden = document.querySelectorAll(".villain");

    for(i = 0; i < hidden.length; i++) {
        hidden[i].style.display = "none";
    }

    let hiddenelement = document.querySelectorAll(".elemental");

    for(i = 0; i < hiddenelement.length; i++) {
        hiddenelement[i].style.display = "none";
    }

        let ninja = document.querySelectorAll(".ninja");

        for (let i = 0; i < ninja.length; i++) {
            ninja[i].style.display = "flex";
        }
    }

    function showAll() {
        let all = document.querySelectorAll(".team-box");

        for(let i = 0; i < all.length; i++) {
            all[i].style.display = "flex";
        }
    }

    function showElemental() {
         let hidden = document.querySelectorAll(".team-box");

    for(i = 0; i < hidden.length; i++) {
        hidden[i].style.display = "none";
    }

        let element = document.querySelectorAll(".elemental");
        for(let i = 0; i < element.length; i++) {
            element[i].style.display = "flex";
        }
    }
    </script>
</body>
</html>
