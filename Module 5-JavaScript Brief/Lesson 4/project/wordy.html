<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wordy</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Prociono&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: purple;
        --section-bg: rgb(255, 226, 255);
        --font: "Prociono", serif;
      }

      * {
        box-sizing: border-box;
      }

      header {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100px;
        padding: 5px 20px;
        background-color: var(--bg);
        color: white;
        font-family: var(--font);
        z-index: 1000;
        border-bottom: 3px solid var(--section-bg);
      }

      body {
        background-color: var(--section-bg);
        margin: 0;
        padding: 0;
      }

      .flex-box {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin: 40px 0px;
        flex-direction: column;
        align-items: center;
      }

      .card {
        max-width: 80%;
        min-height: 400px;
        border: 3px solid var(--bg);
        border-radius: 20px;
        width: 80%;
        transition: 0.4s ease;
        display: flex;
        flex-direction: column;
        gap: 20px;
        color: var(--bg);
        padding: 20px 30px;
      }

      main {
        padding: 125px 0px;
      }

      .card:hover {
        background-color: var(--bg);
        cursor: pointer;
        transform: translateY(-10px);
        box-shadow: 8px 5px 20px var(--bg);
        z-index: 10;
        color: white;
      }

      .card h3 {
        font-size: 30px;
        font-family: var(--font);
        text-align: center;
      }

      input {
        background-color: var(--section-bg);
        font-family: var(--font);
        color: var(--bg);
        border: 2px solid var(--bg);
        max-width: 300px;
        width: 300px;
        height: 50px;
        border-radius: 20px;
        outline: none;
        padding: 5px 10px;
        font-size:20px;
      }

      button {
        background-color: var(--section-bg);
        border: 2px solid var(--bg);
        border-radius: 20px;
        font-size: 15px;
        font-family: var(--font);
        padding: 10px 20px;
        color: var(--bg);
        font-weight: bold;
        transition: 0.4s ease;
        max-width: 150px;
        width: 150px;
      }

      button:hover {
        cursor: pointer;
        user-select: none;
        color: white;
        background-color: var(--bg);
        border: 2px solid var(--section-bg);
      }

      .box {
        max-width: 300px;
        width: 300px;
        height: 50px;
        background-color: var(--section-bg);
        border: 2px solid var(--bg);
        font-family: var(--font);
        border-radius: 20px;
        padding: 5px 10px;
        color: var(--bg);
        display:flex;
        align-items: center;
        justify-content: center;
      }

      .flex {
        display: flex;
        gap: 20px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Wordy</h1>
    </header>

    <main>
      <section>
        <div class="flex-box">
          <div class="card">
            <h3>Check the Type</h3>
            <input
              type="text"
              class="type"
              placeholder="Enter Something, Ex - Text or Number..."
            />
            <button onclick="checkType()">Check Type</button>
            <div id="typeResult" class="box"></div>
          </div>
          <div class="card">
            <h3>Switch the Type</h3>
            <input type="text" class="num" placeholder="Enter Any Number" />
            <div class="flex">
              <button onclick="changeNum()">Change to Number</button>
              <button onclick="changeText()">Change to Text</button>
            </div>
            <div id="typeSwitch" class="box"></div>
          </div>
        </div>
        <div class="flex-box">
          <div class="card">
            <h3>Find and Swap the Word</h3>
            <input type="text" class="word" placeholder="Enter a Sentence..." />
            <input
              type="text"
              class="word2"
              placeholder="Enter the Word to find..."
            />
            <input type="text" class="word4" placeholder="Enter Word you want to swap">
            <input
              type="text"
              class="word3"
              placeholder="Enter the Word to Swap..."
            />
            <div class="flex">
              <button onclick="findWord()">Find Word</button>
              <button onclick="swapWord()">Swap Word</button>
            </div>
            <div id="show" class="box"></div>
          </div>
          <div class="card">
            <h3>Guess the Number</h3>
            <input type="number" class="guess" placeholder="Enter a number 1 to 10">
            <button onclick="checkGuess()">Check</button>
            <div class="box" id="num"></div>
          </div>
        </div>
      </section>
    </main>

    <script>
      function checkType() {
    let type = document.querySelector(".type").value;

    if (isNaN(type)) {
        document.getElementById("typeResult").innerHTML = `${type} is a ${typeof (type)}`;
    } else {
      let newNum = Number(type);
      document.getElementById("typeResult").innerHTML = `${type} is a ${typeof(newNum)}`;
    }
}

function changeNum() {
    let change = document.querySelector(".num").value;

      let num = Number(change)
      document.getElementById("typeSwitch").innerHTML = `${change} is now a ${typeof(num)}`;
    
}

function changeText() {
    let text = document.querySelector(".num").value;

    if (text) {
      let newText = String(text)
      document.getElementById("typeSwitch").innerHTML = `${text} is now a ${typeof(newText)}`;
    } 
}


function swapWord() {
   let sentence = document.querySelector(".word").value;
console.log(sentence);

let wantSwap = document.querySelector(".word4").value;
let swapWith = document.querySelector(".word3").value;

document.querySelector("#show").innerHTML = sentence.replace(wantSwap,swapWith);
}

function findWord() {
  let sentence = document.querySelector(".word").value;
  let find = document.querySelector(".word2").value;

  let found = sentence.search(find);

  document.getElementById("show").innerHTML = `${find} is at position ${found}`;
}

function checkGuess() {
  try{
    let guess = document.querySelector(".guess").value;
    let random = Math.floor(Math.random() * 10) + 1;

    if (guess == random) {
      document.getElementById("num").innerHTML = "Correct You Guessed the Number !!";
    } else{
      throw new Error("Aw You Guessed Wrong !!")
    }
} catch (error){
  document.getElementById("num").innerHTML = error.message;
}

}
    </script>
  </body>
</html>
