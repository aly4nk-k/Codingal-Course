<!DOCTYPE html>
<html>
<head>
    <title>Shoply</title>

    <style>
        :root{
            --primary:#038e3d;
        }

        body {
            font-family: Arial;
            color: white;
            margin: 0;
        }

        *{
            box-sizing: border-box;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: var(--primary);
            height: 80px;
            padding: 0px 20px;
            z-index: 10;
        }

        main{
            padding: 100px 0px;
        }

        form {
            max-width: 40%;
            width: 40%;
            padding: 20px 30px;
            background-color: var(--primary);
            border-radius: 10px;
            margin: 0 auto;
            min-height: 400px;
        }

        input{
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px;
            background-color: white;
            color: var(--primary);
            border: 2px solid white;
            outline: none;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;
            background-color: white;
            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 15px;
            font-weight: bold;
            transition: 0.4s ease;
            margin: 0 auto;
            display: block;
        }

        button:hover{
            cursor: pointer;
            background-color: var(--primary);
            color: white;
            border: 2px solid white;
        }

        ::placeholder{
            color: var(--primary);
        }
    </style>
</head>

<body>

<main>

    <header>
        <h1>Shoply</h1>
    </header>

    <form id="surveyForm">

        <h2>Survey Form</h2>

        <label>Name</label>
        <input 
            type="text" 
            placeholder="Enter your name"
            minlength="2"
            id="name"
        >

        <label>Email</label>
        <input 
            type="email" 
            placeholder="Enter your email"
            id="email"
        >

        <label>Phone</label>
        <input 
            type="tel" 
            placeholder="Enter your phone"
            minlength="9"
            maxlength="13"
            id="phone"
        >

        <button type="submit">Submit</button>

    </form>

</main>

<script>
let form = document.getElementById("surveyForm");

form.addEventListener("submit", (event) => {
    event.preventDefault();

    let nameInput = document.getElementById("name");
    let emailInput = document.getElementById("email");
    let phoneInput = document.getElementById("phone");

    let name = nameInput.value;
    let email = emailInput.value;
    let phone = phoneInput.value;

    if (name === "") {
        nameInput.style.borderColor = "red";
    }

    if (email === "") {
        emailInput.style.borderColor = "red";
    }

    if (phone === "") {
        phoneInput.style.borderColor = "red";
    } else{
        nameInput.style.borderColor = "black";
        emailInput.style.borderColor = "black";
        phoneInput.style.borderColor = "black";
    }
});
</script>

</body>
</html>
