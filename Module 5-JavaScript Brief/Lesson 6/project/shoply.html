<!DOCTYPE html>
<html>
<head>
    <title>Shoply</title>

    <style>
        :root{
            --primary:#038e3d;
        }
        body {
            font-family: Arial;
            color: white;
            margin: 0;
        }

        *{
            box-sizing: border-box;
        }

            position: fixed;

            margin: 0 auto;

            border:none;
            outline:none;
            font-weight: bold;
        }

        button {
            padding: 10px 20px;

            color: var(--primary);
            border: 2px solid var(--primary);
            border-radius: 15px;
            font-weight: bold;
            transition: 0.4s ease;
            margin:0 auto;
            display:block;
        }

        button:hover{
            cursor: pointer;
            background-color: var(--primary);
            color:white;

</head>
