<!DOCTYPE html>
<html>
<head>
  <title>My Playlist Sorter</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
  <style>
    body { background: lavender; }
    h1, h3 { color: darkviolet; }
    .box { background: white; color: darkviolet; }
  </style>
</head>
<body>
<div class="container py-4">

  <h1 class="mb-1">My Playlist Sorter</h1>
  <p class="text-muted mb-4">Sort and label your music playlist using JavaScript array methods!</p>

  <!-- TOPIC 1 & 2: sort() and reverse() -->
  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Song Names</h3>
      <button class="btn btn-primary mr-2" onclick="sortAtoZ()">Sort A to Z</button>
      <button class="btn btn-primary" onclick="sortZtoA()">Sort Z to A</button>
      <div id="nameResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

  <!-- TOPIC 3: sort() with compare function -->
  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Play Counts</h3>
      <button class="btn btn-primary mr-2" onclick="sortByLeastPlayed()">Least Played First</button>
      <button class="btn btn-primary" onclick="sortByMostPlayed()">Most Played First</button>
      <div id="countResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

  <!-- TOPIC 4: map() -->
  <div class="card mb-4">
    <div class="card-body">
      <h3 class="card-title">Label Every Play Count</h3>
      <button class="btn btn-primary" onclick="addLabels()">Add Plays Label</button>
      <div id="labelResult" class="box p-3 mt-3 rounded"></div>
    </div>
  </div>

</div>
<script>
    let songs = [
        " Dai Dai ",
        " Lighter ",
        " Legends Never Die ",
        " Waka Waka ",
        " Animal "
    ];

    let playCounts = [100,13,87,39,67];

    document.getElementById("nameResult").innerHTML = "songs: " + songs;
    document.getElementById("countResult").innerHTML = "No. of Plays: " + playCounts;

    function sortAtoZ() {
        songs.sort();
        let joinedSongs = songs.map(function (s) {
            return `<li>${s} 🎵</li>`;
        });
        let listHTML = `<ol>${joinedSongs.join("")}</ol>`;
          document.getElementById("nameResult").innerHTML = listHTML;
    }

    function sortZtoA() {
        songs.sort();
        songs.reverse();
        document.getElementById("nameResult").innerHTML = "Z to A: " + songs.join(" 🎵 "); 
    }

    function sortByLeastPlayed() {
        playCounts.sort(function (a,b) {
            return a - b;
        });
        document.getElementById("countResult").innerHTML = "By Least Played " + playCounts;

    }

    function sortByMostPlayed() {
        playCounts.sort(function (a,b) {
            return b - a;
        });
        document.getElementById("countResult").innerHTML = "By Most Played " + playCounts;
    }

    function addLabels() {
        let LabelledArray = playCounts.map(function (p) {
            return `<span class="badge bg-success mr-2 p-2"> ${p} plays </span>`;
        });

        document.getElementById("labelResult").innerHTML = LabelledArray;
    }
    </script>
</body>
</html>
