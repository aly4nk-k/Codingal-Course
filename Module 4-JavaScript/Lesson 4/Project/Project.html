<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kai - The Fire Ninja</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=New+Rocker&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" href="fire.jpg">
    <style>
      :root {
        --primary-color: #dc3545;
      }

      .primary {
        color: var(--primary-color);
      }

      .secondary {
        color: white;
      }

      body {
        background-color: black;
        padding-top: 50px;
      }

      .bold {
        font-weight: bold;
      }

      .font {
        font-family: "New Rocker", system-ui;
      }

      .kai-img {
        object-fit: cover;
        max-width: 450px;
        height: 250px;
        border: 2px solid var(--primary-color);
        border-radius: 10px;
      }

      .about {
        border: 2px solid var(--primary-color);
        max-width: 800px;
        border-radius: 20px;
        margin: 0 auto;
        min-height: 700px;
        padding: 20px 30px;
      }

      .about h4 {
        font-family: "New Rocker", system-ui;
        color: var(--primary-color);
      }

      hr {
        background-color: var(--primary-color);
      }

      .about p {
        color: white;
        font-size: 25px;
        font-weight: bolder;
        margin-bottom: 20px;
      }
    </style>
  </head>
  <body class="user-select-none">
    <header class="font text-center">
      <h1>
        <span class="secondary">My </span>
        <span class="primary"> Favourite </span>
        <span class="secondary">Character</span>
      </h1>
      <h3 class="primary bold">Kai</h3>
      <p class="secondary bold">The Brave Fire Ninja From Ninjago</p>
      <img src="kai.png" alt="kai" class="kai-img" />
    </header>

    <main>
      <section class="about my-5">
        <h2 class="font text-center">
          <span class="secondary">About </span>
          <span class="primary">Him</span>
        </h2>
        <hr />
        <h4>Name :</h4>
        <p id="name"></p>
        <h4>Element :</h4>
        <p id="element"></p>
        <h4>Favourite Color :</h4>
        <p id="color"></p>
        <h4>Role :</h4>
        <p id="role"></p>
        <h4>Age :</h4>
        <p id="age"></p>
        <h4>Voice Actor</h4>
        <p id="actor"></p>
        <h4>Famous Quote :</h4>
        <p id="quote"></p>
        <hr />

        <h3 class="text-center font secondary">Object Used</h3>
        <div
          id="object"
          class="text-light border border-danger p-3 rounded"
        ></div>
      </section>
    </main>
    <script>
      let about = {
        name: "Kai Smith",
        element: "Fire",
        color: "Red",
        role: "Ninja / Master of Fire",
        age: "16-17",
        actor: "Vincent Tong",
        quote: " 'Dont You Dare Touch Her, Thats My Sister' ",
      };

      document.getElementById("name").innerHTML = about.name;
      document.getElementById("element").innerHTML = about.element;
      document.getElementById("color").innerHTML = about.color;
      document.getElementById("role").innerHTML = about.role;
      document.getElementById("age").innerHTML = about.age;
      document.getElementById("actor").innerHTML = about["actor"];
      document.getElementById("quote").innerHTML = about["quote"];

      document.getElementById("object").innerHTML = JSON.stringify(about);
    </script>
  </body>
</html>
