<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>M4 L5 A4</title>
    <style>
        #square{
            background-color:midnightblue;
            width:50px;
            height:50px;
            transition: all 0.5s ease-in;
        }
    </style>
  </head>
  <body>
    <button onclick="generate()">Generate Number</button>
    <p id="result"></p>
    <div id="square"></div>
    <script>
      let numberList = [];

      function generate() {
        let num = Math.floor(Math.random() * 360);

        numberList.push(num);

        document.getElementById("result").innerHTML = numberList;

        document.getElementById("square").style.transform = `Rotate(${num}deg)`;
      }

      document.addEventListener("keydown", function(event){
document.getElementById("result").innerHTML = (event.key);

if (event.key == "ArrowUp") {
    document.getElementById("square").style.transform = "TranslateY(-100px)";
}

else if (event.key == "ArrowDown") {
    document.getElementById("square").style.transform = "translateY(100px)";
}
      })
    </script>
  </body>
</html>
