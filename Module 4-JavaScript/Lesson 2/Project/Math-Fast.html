<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Math-Fast</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
      integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N"
      crossorigin="anonymous"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Boogaloo&display=swap"
      rel="stylesheet"
    />
    <style>
      header {
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1;
      }

      .font {
        font-family: "Boogaloo", sans-serif;
      }

      main {
        margin-top: 100px;
      }

      .fs-20 {
        font-size: 20px;
      }

      .generated {
        border: 2px solid black;
        border-radius: 15px;
        width: 100px;
        height: 50px;
        margin: 0 auto;
        padding: 10px 10px;
        font-weight: bold;
        opacity: 0;
        transition: 0.4s ease;
      }

      .card {
        border: 2px solid #ffc107;
        width: 100%;
        min-height: 300px;
        border-radius: 20px;
        margin: 30px 15px;
        padding-top: 50px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
        gap: 20px;
      }

      .btn {
        width: 150px;
      }

      #show {
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <header class="container-fluid bg-warning p-3 font">
      <h1>Math-Fast</h1>
    </header>
    <main>
      <section class="container">
        <div class="text-center">
          <h2 class="text-center">
            <span class="font">Generate Your Number</span>
            <span class="fs-20">(Generate once only)</span>
          </h2>

          <button
            class="btn btn-warning rounded font-weight-bold mt-3"
            type="button"
            onclick="generate()"
          >
            Generate
          </button>
          <p id="gen" class="generated mt-3"></p>
        </div>
      </section>
      <section id="show">
        <div class="grid">
          <div class="card">
            <div class="text-center">
              <h3 class="font">Addition</h3>
              <button
                type="button"
                class="btn btn-warning rounded font-weight-bold mt-3"
                onclick="showSum()"
              >
                ADD
              </button>
              <p class="font-weight-bold mt-3">The Sum of 7 and 9 is :</p>
              <p id="sum" class="generated mt-3"></p>
            </div>
          </div>
          <div class="card">
            <div class="text-center">
              <h3 class="font">Subtraction</h3>
              <button
                type="button"
                class="btn btn-warning rounded font-weight-bold mt-3"
                onclick="showDiff()"
              >
                SUBTRACT
              </button>
              <p class="font-weight-bold mt-3">
                The Difference of 7 and 9 is :
              </p>
              <p id="diff" class="generated mt-3"></p>
            </div>
          </div>
          <div class="card">
            <div class="text-center">
              <h3 class="font">Multiplication</h3>
              <button
                type="button"
                class="btn btn-warning rounded font-weight-bold mt-3"
                onclick="showProduct()"
              >
                Multiply
              </button>
              <p class="font-weight-bold mt-3">The Product of 7 and 9 is :</p>
              <p id="product" class="generated mt-3"></p>
            </div>
          </div>
            <div class="card">
            <div class="text-center">
              <h3 class="font">Division</h3>
              <button
                type="button"
                class="btn btn-warning rounded font-weight-bold mt-3"
                onclick="showQuo()"
              >
                Divide
              </button>
              <p class="font-weight-bold mt-3">The Quotient of 7 and 9 is :</p>
              <p id="divide" class="generated mt-3"></p>
            </div>
          </div>
        </div>
      </section>
    </main>
    <script>
      function generate() {

        document.getElementById("gen").innerHTML = "7 and 9";
        document.getElementById("gen").style.opacity = "1";
        document.getElementById("show").style.opacity = "1";
      }

      let num1 = 7;
      let num2 = 9;

      function showSum() {
        let sum = num1 + num2;
        document.getElementById("sum").innerHTML = `${sum}`;
        document.getElementById("sum").style.opacity = "1";
      }

      function showDiff() {
        let diff = num1 - num2;
        document.getElementById("diff").innerHTML = `${diff}`;
        document.getElementById("diff").style.opacity = "1";
      }

      function showProduct(){
         let product = num1 * num2;
        document.getElementById("product").innerHTML = `${product}`;
        document.getElementById("product").style.opacity = "1";
      }

      function showQuo(){
        let quo = num1 / num2;
        document.getElementById("divide").innerHTML = `${quo}`;
        document.getElementById("divide").style.opacity = "1";
      }
    </script>
  </body>
</html>
