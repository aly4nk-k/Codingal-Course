<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Module 4 - Lesson 3 - Activity 3 - Switch in JS</title>
  </head>
  <body>
    <h2>JavaScript For Loop</h2>
    <p id="demo"></p>
    <script>
      var day;
      switch (new Date().getMonth()) {
        case 0:
          day = "january";
          break;
        case 1:
          day = "feburary";
          break;
        case 2:
          day = "march";
          break;
        case 3:
          day = "april";
          break;
        case 4:
          day = "may";
          break;
        case 5:
          day = "june";
          break;
        case 6:
          day = "july";
          break;
        case 7:
          day = "August";
          break;
          case 8:
          day = 'September';
          break;
          case 9:
          day = 'October';
          break;
          case 10:
          day = 'november';
          break;
          case 11:
          day = 'december';
          break;
      }
      document.getElementById("demo").innerHTML = "Today is " + day;
    </script>
  </body>
</html>
