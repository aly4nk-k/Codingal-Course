<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathRush</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <style>
header{
    position:fixed;
    top:0;
    left:0;
}

main{
    margin-top:100px;
}

.guess{
    border:2px solid black;
    width:100px;
    height:50px;
    padding:10px 10px;
}

#num{
    letter-spacing: 1rem;
}

.flex{
    display:flex;
    gap:50px;
    justify-content: center;
}

#gen{
    display:none;
}
    </style>
</head>
<body>
    <header class="container-fluid bg-danger text-white p-2">
<h1>MathRush</h1>
    </header>

    <main>
        <section class="text-center">
            <h2>Game Time 🎮</h2>
            <h3>Can you Guess the Number ?</h3>
            <p>Try to Guess what number will be Generated</p>
        <h4 id="num"></h4>
            <div class="flex mt-3">
                <div>
                <h4 class="mb-4">Your Guess:</h4>
                <input type="text" class="guess">
                </div>
                <div>
                    <button type="button" class="btn btn-light font-weight-bold mb-3" onclick="shownum()">Generate</button>
                    <p id="gen" class="guess"></p>
                </div>
            </div>
        </section>
        <section class="mt-5 text-center">
            <h2>Check Your Local Day and Month 📅</h2>
            <button type="button" class="btn btn-danger font-weight-bold my-3" onclick="showValue()">Check</button>
            <div>
                <div class="flex">
                    <div>
<h3>Day :</h3>
<p id="day" class="guess"></p>
                    </div>
                    <div>
<h3>Month :</h3>
<p id="month" class="guess"></p>
                    </div>
                </div>
            </div>
        </section>
    </main>
    <script>
        for (let i = 0; i <= 9; i++ ) {
            document.getElementById("num").innerHTML += `${i}`;
        }

        function shownum(){
let randomNum = Math.floor(Math.random() * 10);
document.getElementById("gen").innerHTML = `${randomNum}`;
document.getElementById("gen").style.display = "block";
        }

        function showValue() {
let day;

switch (new Date().getDay()) {
    case 0:
        day = "Sunday";
        break;

    case 1:
        day = "Monday";
        break;

    case 2:
        day = "Tuesday";
        break;

    case 3:
        day = "Wednesday";
        break;

    case 4:
        day = "Thursday";
        break;

    case 5:
        day = "Friday";
        break;

    case 6:
        day = "Saturday";
        break;
}

document.getElementById("day").innerHTML =  ` ${day}`;

let month;

switch (new Date().getMonth()) {
    case 0:
        month = "January";
        break;

    case 1:
        month = "February";
        break;

    case 2:
        month = "March";
        break;

    case 3:
        month = "April";
        break;

    case 4:
        month = "May";
        break;

    case 5:
        month = "June";
        break;

    case 6:
        month = "July";
        break;

    case 7:
        month = "August";
        break;

    case 8:
        month = "September";
        break;

    case 9:
        month = "October";
        break;

    case 10:
        month = "November";
        break;

    case 11:
        month = "December";
        break;

}

document.getElementById("month").innerHTML =  `${month}`;
        }
    </script>
</body>
</html>
