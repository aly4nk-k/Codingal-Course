<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodbye Letter</title>
<link href="https://fonts.googleapis.com/css2?family=Lora&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Birthstone&family=Lora&display=swap" rel="stylesheet">
    <style>
        :root{
--primary:rgb(0, 60, 116);
--font_primary:'Birthstone', cursive;
--font_secondary:'Lora', serif;
--shadow:rgb(11, 121, 211);
        }

        body{
            text-align: center;
            background-image: url('bg.avif');
            width:100%;
            background-repeat: no-repeat;
            background-position: center;
            height:100vh;
            background-size: cover;
            overflow-x: hidden;
            padding:50px 0px;
        }

        button{
            padding:10px 10px;
            border-radius:10px;
            border:3px solid var(--primary);
            background-color:white;
            font-family: var(--font_secondary);
            color:var(--primary);
            font-weight: bold;
            font-size:20px;
            text-shadow:0px 1.5px var(--shadow);
            transition: 0.4s ease;
        }

        h1{
            font-family: var(--font_primary);
            color:var(--primary);
            font-size:60px;
            text-shadow:0px 3px var(--shadow);
            cursor: default;
            user-select: none;
        }

        button:hover{
            cursor: pointer;
            background-color: var(--primary);
            color:white;
            transform:translateY(-5px);
        }
    </style>
</head>
<body>
    <h1>To Abhishek Sir...</h1>
    <button>Open Letter</button>
</body>
</html>
